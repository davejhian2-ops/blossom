<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Morning Blossom</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&family=Allura&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

</head>

<body>
  
  <body>

<!-- Morning Sunlight -->
<div class="sunlight"></div>

<!-- Loading Screen -->

<div id="loading">

<div class="loader"></div>

<p>Preparing a little surprise...</p>

</div>

<!-- Floating Petals -->

<div id="petals"></div>
    
    <div id="sparkles"></div>

<!-- Main -->

<main id="main">

<section class="hero">

<div class="left">

<h1>Good Morning</h1>

<h2>My Langga Lydell</h2>

<p class="subtitle">

A little bouquet prepared for the person who makes my mornings brighter.

</p>

<button id="openBtn">

Open Bouquet

</button>

</div>

<div class="right">

 <div class="bouquet" id="bouquet">

    <div class="sun-glow"></div>

    <div class="flower-shadow"></div>

    <img
    src="assets/bouquet.png"
    id="bouquetImage"
    alt="Bouquet">

    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>
    <div class="leaf leaf3"></div>

    <div class="ribbon" id="ribbon">

        <span class="left-loop"></span>
        <span class="right-loop"></span>
        <span class="knot"></span>

    </div>

</div>

</div>

</section>

<!-- Letter -->

<section id="letterSection">

<div class="letter">

<div class="envelope">

<div class="flap"></div>

<div class="paper">

<h2>For You</h2>

<div id="typing"></div>

<div id="signature">
    With all my love,<br>
    Always cheering for you Langga
</div>

</div>

</div>

</div>

</section>
</main>

<audio id="music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
